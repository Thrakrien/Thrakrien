name: user-statistician

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate the user stats image
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/userstats.svg
          locale: en
          custom-title: GitHub Activity
          # background, border, icons, title and text (Anti-Blind Theme palette)
          colors: '#22262c #30353d #8ab4dc #c3a6e0 #c5c9d0'
          hide-keys: sponsors sponsoring
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
