<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="t">
  <title id="t">Calebe Ferreira, Data Scientist</title>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; }
    .string { stroke: #3a404a; stroke-linecap: round; }
    .pluck { animation: pluck 2.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .s2 { animation-delay: .35s; } .s3 { animation-delay: .7s; } .s4 { animation-delay: 1.05s; }
    .s5 { animation-delay: 1.4s; } .s6 { animation-delay: 1.75s; }
    @keyframes pluck {
      0%, 70%, 100% { transform: scaleY(1); stroke: #4a515c; }
      78% { transform: scaleY(3); stroke: #8ab4dc; }
      86% { transform: scaleY(.6); stroke: #c3a6e0; }
    }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pluck, .cursor { animation: none; } }
  </style>

  <rect width="960" height="260" rx="14" fill="#22262c"/>
  <rect x=".5" y=".5" width="959" height="259" rx="14" fill="none" stroke="#30353d"/>

  <!-- six guitar strings, plucked one after another -->
  <g transform="translate(600 58)">
    <!-- nut, frets (getting closer together) and fret markers -->
    <rect x="-6" y="-10" width="7" height="120" rx="2" fill="#4a515c"/>
    <g fill="#30353d">
      <rect x="88" y="-8" width="3" height="116" rx="1.5"/>
      <rect x="171" y="-8" width="3" height="116" rx="1.5"/>
      <rect x="249" y="-8" width="3" height="116" rx="1.5"/>
      <rect x="322" y="-8" width="3" height="116" rx="1.5"/>
    </g>
    <g fill="#3a404a">
      <circle cx="210" cy="50" r="6"/>
      <circle cx="286" cy="30" r="6"/>
      <circle cx="286" cy="70" r="6"/>
    </g>
    <path class="string pluck"    d="M0 0 H330"   stroke-width="1"/>
    <path class="string pluck s2" d="M0 20 H330"  stroke-width="1.3"/>
    <path class="string pluck s3" d="M0 40 H330"  stroke-width="1.6"/>
    <path class="string pluck s4" d="M0 60 H330"  stroke-width="1.9"/>
    <path class="string pluck s5" d="M0 80 H330"  stroke-width="2.2"/>
    <path class="string pluck s6" d="M0 100 H330" stroke-width="2.5"/>
    <text class="mono" x="330" y="134" text-anchor="end" font-size="13" fill="#868e9a">in 7/8 time</text>
  </g>

  <text class="sans" x="48" y="92" font-size="40" font-weight="600" fill="#d5d8dd">Calebe Ferreira</text>
  <text class="sans" x="50" y="128" font-size="19" fill="#8ab4dc">Data Scientist · MLOps · Cloud</text>

  <!-- a line of Python in the Anti-Blind Theme colors -->
  <text class="mono" x="50" y="196" font-size="15">
    <tspan fill="#c3a6e0">def</tspan>
    <tspan fill="#8ab4dc">free_time</tspan><tspan fill="#8b929c">():</tspan>
    <tspan fill="#c3a6e0">return</tspan>
    <tspan fill="#8b929c">[</tspan><tspan fill="#a6c79a">"classics"</tspan><tspan fill="#8b929c">,</tspan>
    <tspan fill="#a6c79a">"LoL"</tspan><tspan fill="#8b929c">,</tspan>
    <tspan fill="#a6c79a">"Pokémon"</tspan><tspan fill="#8b929c">,</tspan>
    <tspan fill="#a6c79a">"math rock"</tspan><tspan fill="#8b929c">]</tspan>
  </text>
  <rect class="cursor" x="50" y="212" width="9" height="3" fill="#dcc28c"/>
</svg>
